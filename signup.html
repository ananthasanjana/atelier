<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier – Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">
      <span class="logo-name">Atelier</span>
      <span class="logo-tag">one cloth many paths</span>
    </a>
    <nav class="nav">
      <a href="index.html">home</a>
      <a href="#">my closet</a>
      <a href="#">tailors</a>
      <a href="#">marketplace</a>
      <a href="#">community</a>
      <a href="#">events</a>
      <a href="login.html" class="auth-pill" id="authBtn">login</a>
    </nav>
  </header>

  <main class="page">
    <section class="card wide">
      <h1 class="card-title">SIGNUP</h1>

      <form id="signupForm" novalidate>
        <div class="grid-2">
          <label class="field">
            <span>Name</span>
            <input id="name" type="text" autocomplete="name" required>
          </label>
          <label class="field">
            <span>Email Address</span>
            <input id="email" type="email" autocomplete="email" required>
          </label>
          <label class="field">
            <span>Password</span>
            <input id="password" type="password" autocomplete="new-password" minlength="6" required>
          </label>
          <label class="field">
            <span>Repeat Password</span>
            <input id="password2" type="password" autocomplete="new-password" required>
          </label>
        </div>

        <label class="field">
          <span>I am a…</span>
          <select id="role">
            <option value="member">Member / Student</option>
            <option value="tailor">Tailor / Designer</option>
            <option value="seller">Seller</option>
          </select>
        </label>

        <label class="check terms">
          <input type="checkbox" id="terms">
          <span>I agree to <a href="#">Terms of Services</a> and <a href="#">Privacy Policy</a></span>
        </label>

        <button type="submit" class="btn-small" id="signupBtn">Sign Up</button>
      </form>

      <button type="button" class="btn-oauth" id="googleBtn">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Continue with Google
      </button>

      <p class="msg" id="msg" role="status"></p>
      <p class="switch">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      await atelierReady;
      if (!db) return showMessage('Add your Supabase URL and key in supabase.js first.');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const role = document.getElementById('role').value;

      if (!name || !email || !password) return showMessage('Please fill in your name, email and password.');
      if (password.length < 6) return showMessage('Password must be at least 6 characters.');
      if (password !== password2) return showMessage("Passwords don't match.");
      if (!document.getElementById('terms').checked) return showMessage('Please agree to the Terms and Privacy Policy.');

      signupBtn.disabled = true;
      showMessage('Creating your account…', 'ok');

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: pageUrl('index.html'),
          data: {
            display_name: name,
            role: role,            // 'member' | 'tailor' | 'seller'
            terms_accepted: true,
          },
        },
      });
      signupBtn.disabled = false;

      if (error) return showMessage(error.message);

      if (data.session) {
        // Email confirmation is off: they're logged in already
        setRemember(true);
        window.location.href = pageUrl('index.html');
      } else {
        form.reset();
        showMessage('Almost there! Check your email to confirm your account, then log in.', 'ok');
      }
    });

    document.getElementById('googleBtn').addEventListener('click', continueWithGoogle);
  </script>
</body>
</html>
