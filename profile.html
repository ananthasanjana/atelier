<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Atelier</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="inside-page">
  <header class="site-header">
    <a href="index.html" class="logo">
      <span class="logo-name">Atelier</span>
      <span class="logo-tag">one cloth many paths</span>
    </a>
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html">home</a>
      <a href="closet.html">my closet</a>
      <a href="tailors.html">tailors</a>
      <a href="marketplace.html">marketplace</a>
      <a href="community.html">community</a>
      <a href="events.html">events</a>
      <a href="login.html" class="auth-pill" id="authBtn">login</a>
    </nav>
  </header>

  <main class="profile-shell">
    <section class="profile-card" aria-label="User profile">
      <div class="profile-banner" id="profileBanner">
        <img id="bannerImage" alt="" hidden>
        <span class="banner-note" id="bannerNote">a little corner of Atelier</span>
        <img class="profile-avatar" id="avatarImage" alt="" hidden>
        <span class="profile-avatar avatar-placeholder" id="avatarPlaceholder" aria-hidden="true">A</span>
      </div>
      <div class="profile-summary">
        <div class="profile-identity">
          <h1 id="displayName">Loading profile…</h1>
          <p class="profile-handle" id="username"></p>
          <p class="profile-bio" id="bio"></p>
          <span class="role-badge" id="roleBadge" hidden></span>
        </div>
        <div class="profile-actions" id="profileActions"></div>
        <div class="profile-counts" aria-label="Follow counts">
          <span><strong id="followingCount">—</strong> Following</span>
          <span><strong id="followerCount">—</strong> Followers</span>
        </div>
      </div>
    </section>

    <p class="msg profile-message" id="msg" role="status" aria-live="polite">Loading profile…</p>

    <div class="profile-columns">
      <section class="profile-panel" aria-labelledby="postsTitle">
        <div class="panel-heading">
          <h2 id="postsTitle">Posts</h2>
          <span class="handwritten">little things lately</span>
        </div>
        <div class="post-list" id="postList">
          <p class="empty-note">Gathering posts…</p>
        </div>
      </section>

      <section class="profile-panel lookbook-panel" aria-labelledby="lookbookTitle">
        <div class="panel-heading">
          <h2 id="lookbookTitle">My Lookbook</h2>
          <span class="handwritten">saved inspiration</span>
        </div>
        <div class="lookbook-list" id="lookbookList">
          <p class="empty-note">Gathering lookbook…</p>
        </div>
        <button type="button" class="pink-pill" id="lookbookButton">view lookbook</button>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script>
    const profileName = document.getElementById('displayName');
    const profileActions = document.getElementById('profileActions');
    const postList = document.getElementById('postList');
    const lookbookList = document.getElementById('lookbookList');
    let activeProfile;

    function safeImageUrl(value) {
      if (typeof value !== 'string' || !value.trim()) return '';
      try {
        const url = new URL(value);
        return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : '';
      } catch {
        return '';
      }
    }

    function setProfileImage(element, placeholder, value, alt) {
      const url = safeImageUrl(value);
      if (!url) return;
      element.src = url;
      element.alt = alt;
      element.hidden = false;
      placeholder.hidden = true;
      element.addEventListener('error', () => {
        element.hidden = true;
        placeholder.hidden = false;
      }, { once: true });
    }

    function makeAction(label, className, onClick) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = className;
      button.textContent = label;
      button.addEventListener('click', onClick);
      return button;
    }

    async function updateFollowCounts() {
      const [following, followers] = await Promise.all([
        db.from('follows').select('following_id', { count: 'exact', head: true })
          .eq('follower_id', activeProfile.id),
        db.from('follows').select('follower_id', { count: 'exact', head: true })
          .eq('following_id', activeProfile.id),
      ]);
      if (following.error || followers.error) {
        console.error('Could not load follow counts:', following.error || followers.error);
        document.getElementById('followingCount').textContent = '—';
        document.getElementById('followerCount').textContent = '—';
        showMessage('Follow counts are unavailable. Please check the profile tables setup.');
        return;
      }
      document.getElementById('followingCount').textContent = following.count ?? 0;
      document.getElementById('followerCount').textContent = followers.count ?? 0;
    }

    async function setFollowButton(button, viewerId) {
      const { data, error } = await db.from('follows').select('follower_id')
        .eq('follower_id', viewerId).eq('following_id', activeProfile.id).maybeSingle();
      if (error) {
        console.error('Could not check follow status:', error.message);
        button.disabled = false;
        showMessage('Could not check follow status. Please try again.');
        return;
      }
      button.textContent = data ? 'unfollow' : 'follow';
      button.dataset.following = data ? 'true' : 'false';
      button.disabled = false;
    }

    async function toggleFollow(button) {
      const { data: { session }, error: sessionError } = await db.auth.getSession();
      if (sessionError) {
        console.error('Could not check sign-in:', sessionError.message);
        return showMessage('Could not verify your sign-in. Please try again.');
      }
      if (!session) {
        window.location.href = pageUrl('login.html');
        return;
      }

      button.disabled = true;
      const isFollowing = button.dataset.following === 'true';
      const result = isFollowing
        ? await db.from('follows').delete()
          .eq('follower_id', session.user.id).eq('following_id', activeProfile.id)
        : await db.from('follows').insert({
          follower_id: session.user.id,
          following_id: activeProfile.id,
        });
      button.disabled = false;

      if (result.error) {
        console.error('Could not update follow:', result.error.message);
        return showMessage('Could not update your follow. Please try again.');
      }
      showMessage(isFollowing ? 'You unfollowed this profile.' : 'You are now following this profile.', 'ok');
      await setFollowButton(button, session.user.id);
      await updateFollowCounts();
    }

    function renderPost(post, likes) {
      const article = document.createElement('article');
      article.className = 'post-card';
      const title = document.createElement('h3');
      title.textContent = post.title || 'A little update';
      const content = document.createElement('p');
      content.textContent = post.content || '';
      const footer = document.createElement('div');
      footer.className = 'post-footer';
      const likeCount = document.createElement('span');
      likeCount.textContent = `${likes} ${likes === 1 ? 'like' : 'likes'}`;
      const commentButton = makeAction('comments', 'text-action', () => {
        showMessage('Comments will be available in the community soon.');
      });
      footer.append(likeCount, commentButton);
      article.append(title, content, footer);
      return article;
    }

    function renderLookbookItem(item, index) {
      const figure = document.createElement('figure');
      figure.className = 'polaroid';
      figure.style.setProperty('--tilt', index % 2 ? '2deg' : '-2deg');
      const tape = document.createElement('span');
      tape.className = 'washi-tape';
      tape.setAttribute('aria-hidden', 'true');
      const image = document.createElement('img');
      image.alt = item.title || 'Lookbook inspiration';
      const imageUrl = safeImageUrl(item.image_url);
      image.hidden = !imageUrl;
      if (imageUrl) image.src = imageUrl;
      image.addEventListener('error', () => {
        image.hidden = true;
      }, { once: true });
      const caption = document.createElement('figcaption');
      caption.textContent = item.title || 'Untitled inspiration';
      figure.append(tape, image, caption);
      return figure;
    }

    async function loadProfile() {
      await atelierReady;
      if (!db) {
        profileName.textContent = 'Atelier profile';
        showMessage('Connect Supabase in supabase.js to load profiles.');
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const requestedUsername = params.get('u');
      const { data: { session }, error: sessionError } = await db.auth.getSession();
      if (sessionError) {
        profileName.textContent = 'Profile';
        console.error('Could not check sign-in:', sessionError.message);
        showMessage('Could not load your sign-in. Please refresh the page.');
        return;
      }
      if (!requestedUsername && !session) {
        window.location.href = pageUrl('login.html');
        return;
      }

      let profileQuery = db.from('profiles').select('*');
      profileQuery = requestedUsername
        ? profileQuery.eq('username', requestedUsername)
        : profileQuery.eq('id', session.user.id);
      const { data: profile, error } = await profileQuery.maybeSingle();
      if (error) {
        profileName.textContent = 'Profile';
        console.error('Could not load profile:', error.message);
        showMessage('Could not load this profile. Please try again.');
        return;
      }
      if (!profile) {
        profileName.textContent = 'Profile not found';
        showMessage('We could not find a profile with that username.');
        return;
      }
      activeProfile = profile;
      showMessage('', 'ok');
      const isOwnProfile = Boolean(session && session.user.id === profile.id);

      profileName.textContent = profile.display_name || 'Atelier member';
      document.getElementById('username').textContent = profile.username ? `@${profile.username}` : '';
      document.getElementById('bio').textContent = profile.bio || '';
      document.title = `${profile.display_name || profile.username || 'Profile'} | Atelier`;
      setProfileImage(
        document.getElementById('bannerImage'),
        document.getElementById('bannerNote'),
        profile.banner_url,
        `${profile.display_name || 'Profile'} banner`,
      );
      setProfileImage(
        document.getElementById('avatarImage'),
        document.getElementById('avatarPlaceholder'),
        profile.avatar_url,
        `${profile.display_name || 'Profile'} avatar`,
      );
      document.getElementById('avatarPlaceholder').textContent =
        (profile.display_name || profile.username || 'A').charAt(0).toUpperCase();

      const roleIcon = { member: '🛒', tailor: '✂️', seller: '🏷️' }[profile.role] || '🧵';
      const roleBadge = document.getElementById('roleBadge');
      roleBadge.textContent = `${roleIcon} ${ROLE_LABELS[profile.role] || profile.role || 'Atelier member'}`;
      roleBadge.hidden = false;

      profileActions.replaceChildren();
      if (isOwnProfile) {
        profileActions.append(makeAction('edit profile', 'pink-pill', () => {
          showMessage('Profile editing will be added in the next step.');
        }));
      } else {
        const followButton = makeAction('follow', 'pink-pill', () => toggleFollow(followButton));
        if (session) followButton.disabled = true;
        profileActions.append(
          followButton,
          makeAction('message', 'pink-pill', () => showMessage('Messaging will be available soon.')),
        );
        if (session) await setFollowButton(followButton, session.user.id);
      }

      const [postsResult, lookbookResult] = await Promise.all([
        db.from('posts').select('id, title, content, created_at')
          .eq('author_id', profile.id).order('created_at', { ascending: false }).limit(10),
        db.from('lookbook_items').select('id, title, image_url, created_at')
          .eq('user_id', profile.id).order('created_at', { ascending: false }).limit(6),
      ]);
      const dataErrors = [postsResult.error, lookbookResult.error].filter(Boolean);
      if (dataErrors.length) {
        console.error('Could not load profile content:', dataErrors);
        showMessage('Some profile details are unavailable. Check that the profile tables are set up.');
      }

      postList.replaceChildren();
      if (postsResult.data?.length) {
        const postIds = postsResult.data.map((post) => post.id);
        const { data: likes, error: likesError } = await db.from('post_likes')
          .select('post_id').in('post_id', postIds);
        if (likesError) {
          console.error('Could not load like counts:', likesError.message);
          showMessage('Post like counts are unavailable. Please check the profile tables setup.');
        }
        const likeCounts = new Map();
        (likes || []).forEach((like) => likeCounts.set(like.post_id, (likeCounts.get(like.post_id) || 0) + 1));
        postsResult.data.forEach((post) => postList.append(renderPost(post, likeCounts.get(post.id) || 0)));
      } else if (!postsResult.error) {
        const empty = document.createElement('p');
        empty.className = 'empty-note';
        empty.textContent = 'No posts here yet — check back for a little outfit inspiration.';
        postList.append(empty);
      }

      lookbookList.replaceChildren();
      if (lookbookResult.data?.length) {
        lookbookResult.data.forEach((item, index) => lookbookList.append(renderLookbookItem(item, index)));
      } else if (!lookbookResult.error) {
        const empty = document.createElement('p');
        empty.className = 'empty-note';
        empty.textContent = 'This lookbook is waiting for its first favorite.';
        lookbookList.append(empty);
      }

      await updateFollowCounts();
    }

    document.getElementById('lookbookButton').addEventListener('click', () => {
      showMessage('The full lookbook will be available with the closet page.');
    });

    loadProfile();
  </script>
</body>
</html>
