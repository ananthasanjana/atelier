<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#65613f">
    <title>Login | Atelier</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="bg-stripes">
    <header class="atelier-navbar">
      <a class="atelier-brand" href="index.html" aria-label="Atelier home">
        <span class="atelier-brand__name">Atelier</span>
        <span class="atelier-brand__tagline">one cloth many paths</span>
      </a>
      <nav class="atelier-nav-links" aria-label="Main navigation">
        <a href="index.html">home</a>
        <a href="my-closet.html">my closet</a>
        <a href="tailors.html">tailors</a>
        <a href="marketplace.html">marketplace</a>
        <a href="community.html">community</a>
        <a href="events.html">events</a>
      </nav>
      <a class="atelier-login" href="login.html" id="nav-login-btn" aria-current="page">login</a>
      <a class="atelier-profile-link" href="profile.html" id="nav-profile-btn" style="display: none;">
        <span class="atelier-avatar" aria-hidden="true">
          <svg viewBox="0 0 36 36">
            <circle cx="18" cy="12" r="5"></circle>
            <path d="M8 29c0-6 4-9 10-9s10 3 10 9"></path>
          </svg>
        </span>
        <span>Profile</span>
      </a>
    </header>

    <main class="auth-page">
      <section class="auth-card auth-card--login" aria-labelledby="login-title">
        <h1 class="auth-card__title" id="login-title">LOGIN</h1>
        <form class="auth-form auth-form--login" id="login-form">
          <div class="auth-field">
            <label for="login-identity">Email Address</label>
            <input
              id="login-identity"
              name="identity"
              type="text"
              autocomplete="username"
              required
            >
          </div>
          <div class="auth-field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </div>
          <div class="auth-options">
            <a href="#forgot-password">Forgot password?</a>
            <label for="remember-me">
              <input id="remember-me" name="remember" type="checkbox">
              Remember me
            </label>
          </div>
          <button class="auth-submit auth-submit--login" type="submit">Login</button>
          <p class="auth-feedback" id="login-feedback" aria-live="polite"></p>
          <div class="auth-card__providers">
            <button class="auth-provider" id="google-login" type="button">
              <svg class="auth-provider__icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.77 7.18l7.73 6C44.4 38.05 46.98 31.95 46.98 24.55Z"/>
                <path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a23.95 23.95 0 0 0 0 21.56l7.98-6.19Z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.17 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
              </svg>
              <span>Continue with Google</span>
            </button>
          </div>
        </form>
        <p class="auth-card__footer">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/atelier-auth.js"></script>
    <script src="js/supabase-auth.js"></script>
    <script>
      (() => {
        const form = document.getElementById('login-form');
        const feedback = document.getElementById('login-feedback');
        const identityInput = document.getElementById('login-identity');
        const googleButton = document.getElementById('google-login');

        function makeUsername(value) {
          const localPart = value.trim().replace(/^@/, '').split('@')[0];
          const slug = localPart
            .normalize('NFKD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');
          return `@${slug || 'atelier-member'}`;
        }

        function displayNameFromUsername(username) {
          return username
            .slice(1)
            .replace(/[._-]+/g, ' ')
            .split(' ')
            .filter(Boolean)
            .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
            .join(' ') || 'Atelier Member';
        }

        function saveAndContinue(user) {
          try {
            window.localStorage.setItem('atelierUser', JSON.stringify(user));
          } catch (error) {
            console.error('Unable to save the demo user in localStorage.', error);
            feedback.textContent = 'Could not save your demo profile. Please enable browser storage and try again.';
            return;
          }

          const destination = window.atelierAuth
            ? window.atelierAuth.consumeRedirectAfterLogin('profile.html')
            : 'profile.html';
          window.location.assign(destination);
        }

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const username = makeUsername(identityInput.value);
          saveAndContinue({
            name: displayNameFromUsername(username),
            username,
            role: 'Member / Student'
          });
        });

        googleButton.addEventListener('click', () => {
          if (!window.atelierGoogleAuth) {
            feedback.textContent = 'Google sign-in is unavailable. Check your connection and try again.';
            return;
          }
          window.atelierGoogleAuth.start('Member / Student', feedback, googleButton);
        });

        if (window.atelierGoogleAuth) {
          window.atelierGoogleAuth.complete(feedback);
        }
      })();
    </script>
    <script src="js/nav-auth.js"></script>
  </body>
</html>
