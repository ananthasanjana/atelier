<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier – Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">
      <span class="logo-name">Atelier</span>
      <span class="logo-tag">one cloth many paths</span>
    </a>
    <nav class="nav">
      <a href="index.html">home</a>
      <a href="#">my closet</a>
      <a href="#">tailors</a>
      <a href="#">marketplace</a>
      <a href="#">community</a>
      <a href="#">events</a>
      <a href="login.html" class="auth-pill" id="authBtn">login</a>
    </nav>
  </header>

  <main class="page">
    <section class="card">
      <h1 class="card-title">LOGIN</h1>

      <form id="loginForm" novalidate>
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" required>
        </label>

        <div class="row-between">
          <a href="#" id="forgot" class="tiny-link">Forgot password?</a>
          <label class="check"><input type="checkbox" id="remember" checked> Remember me</label>
        </div>

        <button type="submit" class="btn-small" id="loginBtn">Login</button>
      </form>

      <button type="button" class="btn-oauth" id="googleBtn">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Continue with Google
      </button>

      <p class="msg" id="msg" role="status"></p>
      <p class="switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      await atelierReady;
      if (!db) return showMessage('Add your Supabase URL and key in supabase.js first.');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showMessage('Please enter your email and password.');

      loginBtn.disabled = true;
      showMessage('Logging in…', 'ok');

      const { error } = await db.auth.signInWithPassword({ email, password });
      loginBtn.disabled = false;

      if (error) {
        if (error.message.toLowerCase().includes('email not confirmed')) {
          return showMessage('Please confirm your email first — check your inbox.');
        }
        return showMessage(error.message === 'Invalid login credentials'
          ? 'Wrong email or password.'
          : error.message);
      }

      setRemember(document.getElementById('remember').checked);
      window.location.href = pageUrl('index.html');
    });

    document.getElementById('googleBtn').addEventListener('click', continueWithGoogle);

    document.getElementById('forgot').addEventListener('click', async (e) => {
      e.preventDefault();
      await atelierReady;
      if (!db) return showMessage('Add your Supabase URL and key in supabase.js first.');

      const email = document.getElementById('email').value.trim();
      if (!email) return showMessage('Type your email above first, then click "Forgot password?".');

      const { error } = await db.auth.resetPasswordForEmail(email, {
        redirectTo: pageUrl('reset.html'),
      });
      if (error) return showMessage(error.message);
      showMessage('If that email has an account, a reset link is on its way.', 'ok');
    });

    // Already logged in? Go straight home.
    (async () => {
      await atelierReady;
      if (!db) return;
      const { data: { session } } = await db.auth.getSession();
      if (session) window.location.href = pageUrl('index.html');
    })();
  </script>
</body>
</html>
